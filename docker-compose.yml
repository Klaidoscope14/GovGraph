services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: govgraph
    ports:
      - "5432:5432"
    volumes:
      - govgraph-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d govgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  govgraph-postgres:
